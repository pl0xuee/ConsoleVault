name: Release

# Build the Linux AppImage and attach it to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed. The release is created as a draft so you
# can review the assets and edit notes before publishing.
#
# The build runs inside an Arch Linux container ON PURPOSE: AppImages bundle the
# host's WebKitGTK, and Ubuntu's older WebKit fails to initialise EGL on modern
# rolling-release distros (blank/white window). Building on Arch bundles a recent
# WebKit (2.5x) that renders correctly. Trade-off: the resulting AppImage needs a
# reasonably recent glibc, so it targets modern distros.
on:
  push:
    tags:
      - "v*"

# tauri-action needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # --privileged exposes /dev/fuse so the AppImage tooling
      # (linuxdeploy/appimagetool, themselves AppImages) can mount and run.
      options: --privileged
    env:
      # Belt-and-suspenders: also allow extract-and-run if FUSE is unavailable.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # linuxdeploy's bundled `strip` is too old for Arch's modern libraries
      # (fails on the `.relr.dyn` ELF section), which aborts bundling. Skip strip.
      NO_STRIP: "true"
    steps:
      # Installed before checkout so `git` exists for actions/checkout, and so the
      # build uses Arch's current toolchain + WebKit.
      - name: Install system dependencies (Arch)
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git curl wget file \
            rust nodejs npm \
            webkit2gtk-4.1 gtk3 librsvg gdk-pixbuf2 \
            hicolor-icon-theme \
            patchelf openssl fuse2 \
            xdg-utils desktop-file-utils shared-mime-info \
            github-cli jq
          # Modern Arch gdk-pixbuf builds loaders in, so /usr/lib/gdk-pixbuf-2.0/2.10.0
          # doesn't exist unless an external loader package created it. The linuxdeploy
          # GTK plugin insists on copying that dir, so create it + a loaders cache.
          mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders
          gdk-pixbuf-query-loaders --update-cache \
            || gdk-pixbuf-query-loaders > /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache \
            || touch /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache

      - name: Checkout
        uses: actions/checkout@v5

      # Checkout runs as root in the container; avoid git "dubious ownership".
      - name: Trust workspace
        run: git config --global --add safe.directory '*'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build AppImage and publish draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the auto-updater. tauri-action signs the AppImage and
          # generates/uploads latest.json when these are present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ConsoleVault ${{ github.ref_name }}"
          releaseBody: "Download the `.AppImage` below, then `chmod +x` and run it. Requires a recent Linux (glibc 2.38+)."
          releaseDraft: true
          prerelease: false
          # bundle.targets in tauri.conf.json is already ["appimage"]; this keeps
          # the CI intent explicit and future-proof if that changes.
          args: --bundles appimage

      # linuxdeploy's GTK hook hard-codes `export GDK_BACKEND=x11`, citing a 2024
      # WebKitGTK crash (tauri#8541). The hook is sourced by AppRun, so nothing
      # outside the bundle can override it, and the cost is that every window is
      # an XWayland window.
      #
      # Under a compositor with xwayland:force_zero_scaling, X clients are handed
      # raw pixels and must scale themselves from one session-wide GDK_SCALE — a
      # single integer shared by every X client on the desktop. That cannot be
      # right on two monitors at different scales at once: the app draws at 2x on
      # one screen or a fifth too small on another, and no per-window rule can fix
      # it, because XWayland is one X server shared by all of them. A Wayland
      # window is scaled per output by the compositor and follows a monitor change
      # by itself. Verified against WebKitGTK 2.52.5: the crash does not
      # reproduce and the window comes up Wayland-native.
      #
      # This runs after the build rather than inside it because tauri-action does
      # build, sign and upload in one step. Repacking changes the bytes, so the
      # signature it made no longer matches and the updater would refuse the
      # download — hence the re-sign and the amended latest.json below.
      #
      # latest.json is edited rather than regenerated: tauri-action already wrote
      # the asset URLs and platform keys, and only the signature is invalidated by
      # the repack. Rewriting the whole file by hand is how you get a release that
      # looks correct and an updater that 404s.
      #
      # The release is a draft, so none of this is visible until it is published
      # by hand. If any of it fails the job fails and the draft is left alone.
      - name: Repack the AppImage for the host's Wayland stack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGETOOL_SHA256: "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1"
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/appimage
          APP="$(ls ./*.AppImage)"
          APP="${APP#./}"

          ./"$APP" --appimage-extract >/dev/null
          HOOK=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          grep -q '^export GDK_BACKEND=x11' "$HOOK" \
            || { echo "::error::no forced GDK_BACKEND=x11 in the GTK hook — has linuxdeploy changed?"; exit 1; }
          # A list rather than a bare `wayland` so an X11 session still starts,
          # and defaulted rather than assigned so a regression can be worked
          # around from the environment without unpacking the bundle.
          sed -i 's|^export GDK_BACKEND=x11.*|export GDK_BACKEND="${GDK_BACKEND:-wayland,x11}"|' "$HOOK"

          # Pinned, not "continuous": this tool repackages an AppImage that we
          # then sign with our own key, so a retagged or compromised upstream
          # build would be signed as legitimate and auto-installed by every user.
          curl -sLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          rm -f "$APP" "$APP.sig"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APP"
          rm -rf squashfs-root appimagetool

          cd "$GITHUB_WORKSPACE"
          npx tauri signer sign "src-tauri/target/release/bundle/appimage/$APP"
          SIG="$(cat "src-tauri/target/release/bundle/appimage/$APP.sig")"
          test -n "$SIG" || { echo "::error::no signature written for $APP"; exit 1; }

          gh release download "$GITHUB_REF_NAME" --pattern latest.json --output latest.json --clobber
          jq --arg sig "$SIG" '.platforms |= with_entries(.value.signature = $sig)' \
            latest.json > latest.json.new
          mv latest.json.new latest.json
          cat latest.json

          gh release upload "$GITHUB_REF_NAME" \
            "src-tauri/target/release/bundle/appimage/$APP" \
            "src-tauri/target/release/bundle/appimage/$APP.sig" \
            latest.json --clobber
